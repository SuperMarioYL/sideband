<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" xml:space="preserve" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" role="img" aria-labelledby="integrations-light.svg-title integrations-light.svg-desc"><title id="integrations-light.svg-title">What Sideband reads, declares and writes</title><desc id="integrations-light.svg-desc">Three groups: routes read back from the engine (version, served_model, max_model_len, prefix_caching), two values the operator declares (scheduler limit and launch command), and the artifacts Sideband writes (channel_budget.json, channel_budget.md, trace JSONL). vLLM, llama.cpp server and SGLang are supported API surfaces, not bundled engines.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5660e6"/><stop offset=".55" stop-color="#8958c1"/><stop offset="1" stop-color="#607189"/></linearGradient><radialGradient id="halo"><stop stop-color="#5660e6" stop-opacity="0.13"/><stop offset="1" stop-color="#5660e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbcef7" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#5660e6" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 13;animation:flow 6.5s linear infinite}
.drift{animation:drift 9s ease-in-out infinite}
.pulse{animation:pulse 5.5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes drift{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.flow,.drift,.pulse{animation:none}}
</style><rect width="1000" height="470" rx="16" fill="#f9f9fe"/><rect width="1000" height="470" rx="16" fill="url(#grid)" opacity="0.75"/><text x="32" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#556088" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1.4">CAPABILITIES / READ BACK, DECLARED, WRITTEN</text><text x="32" y="66" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#131730" font-weight="600" text-anchor="start" opacity="1">A split fingerprint: routes it reads, values you declare</text><text x="32" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.2">READ BACK FROM THE ENGINE</text><rect x="32" y="112" width="264" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="46" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /version</text><text x="46" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">version</text><rect x="32" y="170" width="264" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="46" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /v1/models</text><text x="46" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">served_model, max_model_len</text><rect x="32" y="228" width="264" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="46" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /metrics</text><text x="46" y="266" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">prefix_caching (vllm:cache_config_info)</text><text x="32" y="300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#8958c1" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.2">YOU DECLARE</text><rect x="32" y="312" width="264" height="96" rx="12" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="46" y="338" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#131730" font-weight="400" text-anchor="start" opacity="1">--declare-max-num-seqs</text><text x="46" y="356" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#131730" font-weight="400" text-anchor="start" opacity="1">--launch-cmd</text><text x="46" y="380" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#556088" font-weight="400" text-anchor="start" opacity="1">no production route serves scheduler</text><text x="46" y="396" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#556088" font-weight="400" text-anchor="start" opacity="1">config or the launch command</text><rect x="356" y="150" width="252" height="116" rx="18" fill="#f7f7fe" stroke="#5660e6" stroke-width="1.5" opacity="1"/><text x="482" y="182" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#131730" font-weight="650" text-anchor="middle" opacity="1">Sideband</text><text x="482" y="206" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#556088" font-weight="400" text-anchor="middle" opacity="1">probe stream</text><text x="482" y="232" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.2" fill="#5660e6" font-weight="400" text-anchor="middle" opacity="1">POST /v1/chat/completions</text><text x="482" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="middle" opacity="1">streaming canary rounds</text><path d="M296 200L352 194" fill="none" stroke="#5660e6" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><path d="M270 312 V 288 H 382 V 268" fill="none" stroke="#8958c1" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><text x="700" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#607189" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.2">WRITTEN</text><rect x="700" y="112" width="268" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="714" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">channel_budget.json</text><text x="714" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">rate, ci95, null, verdict</text><rect x="700" y="170" width="268" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="714" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">channel_budget.md</text><text x="714" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">one page, same facts</text><rect x="700" y="228" width="268" height="50" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="714" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">trace JSONL</text><text x="714" y="266" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">--trace-out, replayable</text><path d="M608 208L696 168" fill="none" stroke="#607189" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><text x="356" y="322" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1">SPEAKS THE SAME CHAT-COMPLETIONS API</text><rect x="356" y="336" width="49.2" height="28" rx="14" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="380.6" y="353.78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">vLLM</text><rect x="417.2" y="336" width="124.79999999999997" height="28" rx="14" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="479.59999999999997" y="353.78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">llama.cpp server</text><rect x="554" y="336" width="61.8" height="28" rx="14" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="584.9" y="353.78" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">SGLang</text><text x="356" y="386" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">Supported API surface, not bundled and not auto-detected.</text><text x="356" y="404" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">A field an engine does not serve is recorded as not served.</text><path d="M482 266 V 310" fill="none" stroke="#556088" stroke-width="1.3" stroke-opacity="1" marker-end="url(#arrow)" stroke-dasharray="4 6"/><text x="32" y="446" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.2" fill="#556088" font-weight="400" text-anchor="start" opacity="1">No scoring, no policy threshold, no compliance verdict. The number belongs to one engine build.</text></svg>
