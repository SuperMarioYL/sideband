<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" xml:space="preserve" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" role="img" aria-labelledby="process-light.svg-title process-light.svg-desc"><title id="process-light.svg-title">One Sideband round in five stages</title><desc id="process-light.svg-desc">Five ordered stages of one round: calibrate a midpoint threshold on known bits; encode a 0 as 4 decode steps and a 1 as 32; co-schedule sender and receiver with background traffic at 0.5x and 1.0x; decode from the receiver&#39;s own mean step time; report correct-minus-wrong bits per slot second with a bootstrap interval, gated on a shuffled-bit null reading near zero.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5660e6"/><stop offset=".55" stop-color="#8958c1"/><stop offset="1" stop-color="#607189"/></linearGradient><radialGradient id="halo"><stop stop-color="#5660e6" stop-opacity="0.13"/><stop offset="1" stop-color="#5660e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbcef7" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#5660e6" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 13;animation:flow 6.5s linear infinite}
.drift{animation:drift 9s ease-in-out infinite}
.pulse{animation:pulse 5.5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes drift{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.flow,.drift,.pulse{animation:none}}
</style><rect width="1000" height="440" rx="16" fill="#f9f9fe"/><rect width="1000" height="440" rx="16" fill="url(#grid)" opacity="0.75"/><text x="32" y="34" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#556088" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1.5">PROCESS / ONE ROUND, FIVE STAGES</text><text x="32" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20.5" fill="#131730" font-weight="600" text-anchor="start" opacity="1">One bit per round, decoded from the receiver&#39;s own timing</text><rect x="32" y="88" width="178" height="226" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="46" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">01</text><text x="46" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Calibrate</text><text x="46" y="166" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">Known-bit rounds set the</text><text x="46" y="180" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">midpoint threshold between</text><text x="46" y="194" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">the 0 and 1 step times.</text><line x1="48" y1="280" x2="194" y2="280" stroke="#cbcef7" stroke-width="1"/><circle cx="78" cy="280" r="4" fill="#8958c1" opacity="1"/><circle cx="164" cy="280" r="4" fill="#5660e6" opacity="1"/><line x1="121" y1="260" x2="121" y2="300" stroke="#556088" stroke-width="1" stroke-dasharray="3 4"/><text x="78" y="300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#556088" font-weight="400" text-anchor="middle" opacity="1">0</text><text x="164" y="300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#556088" font-weight="400" text-anchor="middle" opacity="1">1</text><text x="121" y="254" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.4" fill="#556088" font-weight="400" text-anchor="middle" opacity="1">mid</text><path d="M211 201L222 201" fill="none" stroke="#5660e6" stroke-width="1.3" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="225" y="88" width="178" height="226" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="239" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">02</text><text x="239" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Encode</text><text x="239" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.4" fill="#131730" font-weight="400" text-anchor="start" opacity="1">0 → 4 decode steps</text><text x="239" y="188" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.4" fill="#131730" font-weight="400" text-anchor="start" opacity="1">1 → 32 decode steps</text><text x="239" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.4" fill="#556088" font-weight="400" text-anchor="start" opacity="1">one bit per round</text><text x="241" y="246" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.4" fill="#556088" font-weight="400" text-anchor="start" opacity="1">decode steps</text><rect x="241" y="258" width="22" height="8" rx="4" fill="#8958c1" stroke="none" stroke-width="1.1" opacity="1"/><text x="271" y="266" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#556088" font-weight="400" text-anchor="start" opacity="1">4</text><rect x="241" y="280" width="118" height="8" rx="4" fill="#5660e6" stroke="none" stroke-width="1.1" opacity="1"/><text x="365" y="288" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#556088" font-weight="400" text-anchor="start" opacity="1">32</text><path d="M404 201L415 201" fill="none" stroke="#5660e6" stroke-width="1.3" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="418" y="88" width="178" height="226" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="432" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">03</text><text x="432" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Co-schedule</text><text x="432" y="166" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">Sender and receiver share</text><text x="432" y="180" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">the batch while background</text><text x="432" y="194" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">traffic reaches 0.5x and</text><text x="432" y="208" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">1.0x.</text><text x="434" y="244" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.4" fill="#556088" font-weight="400" text-anchor="start" opacity="1">one batch step</text><rect x="434" y="254" width="146" height="52" rx="8" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><rect x="442" y="262" width="52" height="6" rx="3" fill="#8958c1" stroke="none" stroke-width="1.1" opacity="1"/><rect x="474" y="274" width="52" height="6" rx="3" fill="#607189" stroke="none" stroke-width="1.1" opacity="1"/><rect x="504" y="286" width="44" height="6" rx="3" fill="#556088" stroke="none" stroke-width="1.1" opacity="0.35"/><path d="M597 201L608 201" fill="none" stroke="#5660e6" stroke-width="1.3" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="611" y="88" width="178" height="226" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="625" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">04</text><text x="625" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Decode</text><text x="625" y="166" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">The receiver compares its</text><text x="625" y="180" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">mean step time to the</text><text x="625" y="194" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">threshold: above is 1, below</text><text x="625" y="208" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">is 0.</text><line x1="627" y1="276" x2="773" y2="276" stroke="#556088" stroke-width="1" stroke-dasharray="3 4"/><line x1="637" y1="276" x2="637" y2="252" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><line x1="657" y1="276" x2="657" y2="260" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><line x1="675" y1="276" x2="675" y2="252" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><line x1="693" y1="276" x2="693" y2="292" stroke="#556088" stroke-width="1.6" opacity=".85"/><line x1="713" y1="276" x2="713" y2="252" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><line x1="731" y1="276" x2="731" y2="260" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><line x1="751" y1="276" x2="751" y2="252" stroke="#5660e6" stroke-width="1.6" opacity=".85"/><text x="773" y="262" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#5660e6" font-weight="400" text-anchor="end" opacity="1">1</text><text x="773" y="292" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#556088" font-weight="400" text-anchor="end" opacity="1">0</text><path d="M790 201L801 201" fill="none" stroke="#5660e6" stroke-width="1.3" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="804" y="88" width="178" height="226" rx="12" fill="#f7f7fe" stroke="#5660e6" stroke-width="1.1" opacity="1"/><text x="818" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">05</text><text x="818" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Report</text><text x="818" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">correct − wrong bits</text><text x="818" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">÷ slot seconds</text><text x="818" y="204" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">ci95 by bootstrap</text><text x="818" y="224" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">null reads ≈ 0</text><rect x="820" y="250" width="62" height="14" rx="7" fill="#f3f4fd" stroke="#5660e6" stroke-width="1.1" opacity="1"/><text x="851" y="260.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.6" fill="#5660e6" font-weight="400" text-anchor="middle" opacity="1">rate</text><rect x="820" y="270" width="62" height="14" rx="7" fill="#f3f4fd" stroke="#8958c1" stroke-width="1.1" opacity="1"/><text x="851" y="280.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.6" fill="#8958c1" font-weight="400" text-anchor="middle" opacity="1">ci95</text><rect x="820" y="290" width="62" height="14" rx="7" fill="#f3f4fd" stroke="#607189" stroke-width="1.1" opacity="1"/><text x="851" y="300.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.6" fill="#607189" font-weight="400" text-anchor="middle" opacity="1">verdict</text><text x="894" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">json + md</text><text x="894" y="294" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="8.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">same facts</text><rect x="32" y="330" width="936" height="76" rx="12" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="48" y="356" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#8958c1" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.2">SHUFFLED-BIT NULL</text><text x="48" y="378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">Keep decoded bits, permute ground-truth bits, re-run the same function.</text><text x="48" y="394" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">A point counts as signal only once the null reads near zero.</text><line x1="580" y1="342" x2="580" y2="394" stroke="#cbcef7" stroke-width="1"/><text x="600" y="356" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.2">CEILING</text><text x="600" y="378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">ceiling = 1 / slot_seconds</text><text x="600" y="394" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#556088" font-weight="400" text-anchor="start" opacity="1">a 300 ms slot caps the rate at 3.3 bits/session/s</text></svg>
