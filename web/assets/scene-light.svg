<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xml:space="preserve" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" role="img" aria-labelledby="scene-light.svg-title scene-light.svg-desc"><title id="scene-light.svg-title">Sideband — two sessions, one inference engine, no socket</title><desc id="scene-light.svg-desc">Two agent sessions are attached to one shared inference engine. A direct session-to-session line is crossed out and labelled no socket; the channel runs through the engine as batch occupancy in and timing out. The measured quantity is bits per session per second with a bootstrap interval and a three-way verdict.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5660e6"/><stop offset=".55" stop-color="#8958c1"/><stop offset="1" stop-color="#607189"/></linearGradient><radialGradient id="halo"><stop stop-color="#5660e6" stop-opacity="0.13"/><stop offset="1" stop-color="#5660e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbcef7" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#5660e6" stroke-width="1.6"/></marker></defs><style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1600" height="900" rx="16" fill="#f9f9fe"/><rect width="1600" height="900" rx="16" fill="url(#grid)" opacity="0.75"/><ellipse cx="1080" cy="380" rx="470" ry="330" fill="url(#halo)"/><circle cx="1080" cy="380" r="236" 