" fill="#607189" opacity="0.55" class="drift" style="animation-delay:5.6s"/><circle cx="1160" cy="240" r="1.6" fill="#607189" opacity="0.55" class="drift" style="animation-delay:6.4s"/><circle cx="1100" cy="740" r="1.9" fill="#607189" opacity="0.55" class="drift" style="animation-delay:7.2s"/></svg>
