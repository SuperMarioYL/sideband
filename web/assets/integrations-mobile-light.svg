<svg xmlns="http://www.w3.org/2000/svg" width="420" height="830" viewBox="0 0 420 830" xml:space="preserve" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" role="img" aria-labelledby="integrations-mobile-light.svg-title integrations-mobile-light.svg-desc"><title id="integrations-mobile-light.svg-title">What Sideband reads, declares and writes (narrow)</title><desc id="integrations-mobile-light.svg-desc">Narrow layout: the probe stream, read-back routes, operator-declared values, written artifacts and the three supported chat-completions engines.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5660e6"/><stop offset=".55" stop-color="#8958c1"/><stop offset="1" stop-color="#607189"/></linearGradient><radialGradient id="halo"><stop stop-color="#5660e6" stop-opacity="0.13"/><stop offset="1" stop-color="#5660e6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbcef7" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#5660e6" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 13;animation:flow 6.5s linear infinite}
.drift{animation:drift 9s ease-in-out infinite}
.pulse{animation:pulse 5.5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes drift{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.flow,.drift,.pulse{animation:none}}
</style><rect width="420" height="830" rx="16" fill="#f9f9fe"/><rect width="420" height="830" rx="16" fill="url(#grid)" opacity="0.75"/><text x="28" y="36" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#556088" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1.1">CAPABILITIES / SPLIT FINGERPRINT</text><text x="28" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Routes it reads, values you declare</text><rect x="28" y="92" width="364" height="92" rx="12" fill="#f3f4fd" stroke="#5660e6" stroke-width="1.1" opacity="1"/><text x="44" y="118" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#131730" font-weight="600" text-anchor="start" opacity="1">Sideband probe stream</text><text x="44" y="140" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#5660e6" font-weight="400" text-anchor="start" opacity="1">POST /v1/chat/completions (streaming)</text><text x="44" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">canary rounds, one bit each</text><text x="28" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.1">READ BACK FROM THE ENGINE</text><rect x="28" y="220" width="364" height="136" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="44" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /version</text><text x="44" y="263" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">version</text><text x="44" y="286" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /v1/models</text><text x="44" y="301" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">served_model, max_model_len</text><text x="44" y="324" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">GET /metrics</text><text x="44" y="339" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">prefix_caching (vllm:cache_config_info)</text><text x="28" y="374" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#8958c1" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.1">YOU DECLARE</text><rect x="28" y="386" width="364" height="96" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="44" y="414" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#131730" font-weight="600" text-anchor="start" opacity="1">--declare-max-num-seqs</text><text x="44" y="429" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">must match the engine launch</text><text x="44" y="452" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#131730" font-weight="600" text-anchor="start" opacity="1">--launch-cmd</text><text x="44" y="467" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">recorded in the fingerprint</text><text x="28" y="500" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#607189" font-weight="600" text-anchor="start" opacity="1" letter-spacing="1.1">WRITTEN</text><rect x="28" y="512" width="364" height="136" rx="12" fill="#f7f7fe" stroke="#cbcef7" stroke-width="1.1" opacity="1"/><text x="44" y="540" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">channel_budget.json</text><text x="44" y="555" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">rate, ci95, null, verdict</text><text x="44" y="578" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">channel_budget.md</text><text x="44" y="593" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">one page, same facts</text><text x="44" y="616" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.4" fill="#5660e6" font-weight="600" text-anchor="start" opacity="1">trace JSONL</text><text x="44" y="631" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">--trace-out, replayable</text><text x="28" y="678" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1">SPEAKS THE SAME CHAT-COMPLETIONS API</text><rect x="28" y="690" width="46" height="27" rx="13.5" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="51" y="707.1" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">vLLM</text><rect x="86" y="690" width="118" height="27" rx="13.5" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="145" y="707.1" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">llama.cpp server</text><rect x="216" y="690" width="58" height="27" rx="13.5" fill="#f3f4fd" stroke="#cbcef7" stroke-width="1"/><text x="245" y="707.1" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#131730" font-weight="600" text-anchor="middle" opacity="1">SGLang</text><text x="28" y="742" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">Supported API surface, not bundled and not auto-detected.</text><text x="28" y="760" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">A field an engine does not serve is recorded as not served.</text><text x="28" y="788" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">No scoring, no policy threshold, no compliance verdict.</text><text x="28" y="806" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#556088" font-weight="400" text-anchor="start" opacity="1">The number belongs to one engine build.</text></svg>
