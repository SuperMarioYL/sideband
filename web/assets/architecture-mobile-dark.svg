<svg xmlns="http://www.w3.org/2000/svg" width="420" height="820" viewBox="0 0 420 820" xml:space="preserve" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" role="img" aria-labelledby="architecture-mobile-dark.svg-title architecture-mobile-dark.svg-desc"><title id="architecture-mobile-dark.svg-title">Sideband architecture (narrow)</title><desc id="architecture-mobile-dark.svg-desc">Narrow layout of the architecture: the user&#39;s engine over HTTP, the seven Sideband modules in one process, and the three written artifacts.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#666fe8"/><stop offset=".55" stop-color="#a46ae7"/><stop offset="1" stop-color="#acccf6"/></linearGradient><radialGradient id="halo"><stop stop-color="#666fe8" stop-opacity="0.24"/><stop offset="1" stop-color="#666fe8" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171b41" stroke-opacity=".55" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#666fe8" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 13;animation:flow 6.5s linear infinite}
.drift{animation:drift 9s ease-in-out infinite}
.pulse{animation:pulse 5.5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-200}}
@keyframes drift{0%,100%{opacity:.2}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.flow,.drift,.pulse{animation:none}}
</style><rect width="420" height="820" rx="16" fill="#050712"/><rect width="420" height="820" rx="16" fill="url(#grid)" opacity="0.5"/><text x="28" y="36" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1" letter-spacing="1.2">ARCHITECTURE / ONE PROCESS</text><text x="28" y="68" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="18" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">Seven modules, one HTTP surface</text><rect x="28" y="92" width="364" height="160" rx="12" fill="#0c101f" stroke="#171b41" stroke-width="1.1" opacity="1"/><text x="44" y="118" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="13.5" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">your engine</text><text x="44" y="136" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">OpenAI-compatible HTTP</text><text x="44" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">GET /version</text><text x="232" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">version</text><text x="44" y="186" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">GET /v1/models</text><text x="232" y="186" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">served_model, max_model_len</text><text x="44" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">GET /metrics</text><text x="232" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">prefix_caching</text><text x="44" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">POST /v1/chat/completions</text><text x="232" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.2" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">canary stream</text><path d="M210 256L210 282" fill="none" stroke="#666fe8" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><text x="220" y="274" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">HTTP</text><rect x="28" y="288" width="364" height="336" rx="12" fill="#0c101f" stroke="#666fe8" stroke-width="1.3" opacity="1"/><text x="44" y="314" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12.5" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">sideband · one process, no daemon</text><text x="44" y="344" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">cli.py</text><text x="140" y="344" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">subcommands and flags</text><text x="44" y="382" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">engine.py</text><text x="140" y="382" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">HTTP client, public routes only</text><text x="44" y="420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">models.py</text><text x="140" y="420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">trace and report schema</text><text x="44" y="458" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">canary.py</text><text x="140" y="458" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">encode one bit as decode steps</text><text x="44" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">measure.py</text><text x="140" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">the single statistics path</text><text x="44" y="534" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">replay.py</text><text x="140" y="534" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">same function, recorded input</text><text x="44" y="572" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#eef5fd" font-weight="600" text-anchor="start" opacity="1">report.py</text><text x="140" y="572" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.8" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">channel_budget.json + .md</text><text x="44" y="614" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">measure.py is the only statistics path.</text><path d="M210 628L210 654" fill="none" stroke="#acccf6" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><text x="220" y="646" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">writes</text><rect x="28" y="660" width="364" height="108" rx="12" fill="#0c101f" stroke="#171b41" stroke-width="1.1" opacity="1"/><text x="44" y="686" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">channel_budget.json</text><text x="200" y="686" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">rate, ci95, verdict</text><text x="44" y="714" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">channel_budget.md</text><text x="200" y="714" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">one page</text><text x="44" y="742" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.6" fill="#666fe8" font-weight="600" text-anchor="start" opacity="1">trace JSONL</text><text x="200" y="742" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.6" fill="#959ec4" font-weight="400" text-anchor="start" opacity="1">--trace-out, replayable</text></svg>
