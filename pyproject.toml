[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sideband"
version = "0.1.0"
description = "Covert channel bitrate meter for shared LLM inference servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SuperMarioYL" }]
keywords = ["llm", "inference", "isolation", "covert-channel", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sideband = "sideband.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/sideband"

[tool.hatch.build.targets.wheel]
packages = ["sideband"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
