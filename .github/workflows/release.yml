name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: wheel + sdist as release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Attach wheel, sdist and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    # Opt-in. A fresh repository has no PyPI Trusted Publisher registered, so an
    # always-on job would fail the first release. Set the repository variable
    # PYPI_PUBLISH=true and register the publisher when you intend to ship.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
