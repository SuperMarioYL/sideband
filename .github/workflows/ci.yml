name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Create environment
        run: uv venv --python 3.12

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -q
