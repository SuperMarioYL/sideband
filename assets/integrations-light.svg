<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="What Sideband reads, declares and writes" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What Sideband reads, declares and writes</title><desc>Orbital figure: four read-back routes and the probe stream connect to the CLI, two operator-declared inputs feed the fingerprint, and three artifacts come out; vLLM, llama.cpp server and SGLang are supported engines.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
