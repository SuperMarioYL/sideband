<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Sideband architecture" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sideband architecture</title><desc>The CLI and seven Python modules sit above an HTTP boundary; the user's engine is never bundled. A probe trace is the evidence and the channel budget is the claim.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="880" height="440" fill="#f9f9fe"/><rect x="0" y="0" width="880" height="440" fill="none"/><text x="40" y="38" font-size="11" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2.2">ONE PROCESS, ONE HTTP DEPENDENCY</text><rect x="40" y="58" width="236" height="126" rx="12" fill="#f7f7fe" stroke="#5660e6" stroke-width="1.4"/><text x="60" y="86" font-size="17" font-weight="650" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sideband CLI</text><text x="60" y="110" font-size="12" font-weight="600" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >measure</text><text x="60" y="130" font-size="12" font-weight="600" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >replay</text><text x="60" y="150" font-size="12" font-weight="600" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >fingerprint</text><text x="60" y="171" font-size="9.5" font-weight="500" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >Typer · httpx · pydantic · numpy</text><rect x="312" y="58" width="368" height="240" rx="12" fill="#f3f4fd" stroke="#cbcef7"/><text x="332" y="84" font-size="11" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sideband/ · Python package</text><rect x="332" y="106" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="344" y="126" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >engine.py</text><text x="344" y="142" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >public HTTP surface</text><text x="344" y="154" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >version · models · metrics</text><rect x="510" y="106" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="522" y="126" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >canary.py</text><text x="522" y="142" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bit &lt;-&gt; decode steps</text><text x="522" y="154" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >encode · calibrate · decode</text><rect x="332" y="168" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="344" y="188" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >measure.py</text><text x="344" y="204" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the one statistics path</text><text x="344" y="216" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sweep · ratio · bootstrap</text><rect x="510" y="168" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="522" y="188" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >replay.py</text><text x="522" y="204" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >trace in, same analyse()</text><text x="522" y="216" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >no engine, no GPU</text><rect x="332" y="230" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="344" y="250" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >report.py</text><text x="344" y="266" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >two artifacts</text><text x="344" y="278" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >json + one-page markdown</text><rect x="510" y="230" width="164" height="50" rx="7" fill="#f7f7fe" stroke="#cbcef7"/><text x="522" y="250" font-size="12" font-weight="650" fill="#5660e6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >models.py</text><text x="522" y="266" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >typed contract</text><text x="522" y="278" font-size="8.6" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >ChannelBudget · ProbeTrace</text><rect x="712" y="58" width="128" height="240" rx="12" fill="#f7f7fe" stroke="#8958c1" stroke-width="1.4"/><text x="776" y="88" font-size="12.5" font-weight="650" fill="#131730" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >your engine</text><circle cx="776" cy="146" r="30" fill="none" stroke="#8958c1" stroke-width="1.3" class="pulse"/><circle cx="776" cy="146" r="12" fill="#8958c1" opacity=".55" class="glow"/><text x="776" y="200" font-size="10.5" font-weight="500" fill="#556088" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >vLLM</text><text x="776" y="220" font-size="10.5" font-weight="500" fill="#556088" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >llama.cpp</text><text x="776" y="240" font-size="10.5" font-weight="500" fill="#556088" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >SGLang</text><text x="776" y="278" font-size="9.5" font-weight="600" fill="#607189" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >not bundled</text><path d="M276 121 L312 121" stroke="#5660e6" stroke-width="1.5" class="flow"/><path d="M680 150 L712 150" stroke="#5660e6" stroke-width="1.5" class="flow"/><text x="696" y="138" font-size="9" font-weight="600" fill="#556088" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >HTTP</text><line x1="496" y1="298" x2="496" y2="330" stroke="#5660e6" stroke-width="1.5" class="flow"/><rect x="312" y="330" width="368" height="76" rx="10" fill="#f3f4fd" stroke="#cbcef7"/><text x="332" y="354" font-size="11.5" font-weight="650" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >probe trace JSONL</text><text x="332" y="371" font-size="9.5" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >evidence: one row per request</text><path d="M452 366 L488 366" stroke="#5660e6" stroke-width="1.3" class="flow"/><text x="508" y="354" font-size="11.5" font-weight="650" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >channel_budget.json / .md</text><text x="508" y="371" font-size="9.5" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >claim: rate, ci95, verdict, fingerprint</text><text x="40" y="420" font-size="10.5" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Live and replay call the same analyse(): a replay cannot read rosier than the run that produced the trace.</text></svg>