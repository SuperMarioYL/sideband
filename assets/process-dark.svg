<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="The step-sizing round" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The step-sizing round</title><desc>Five stages across one 300 ms round: calibrated threshold, bit encoded as 4 or 32 decode steps, co-scheduled batch, receiver-side decode, and a ratio with bootstrap interval and verdict.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="880" height="360" fill="#050712"/><text x="40" y="38" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2.2">ONE ROUND, FIVE STAGES</text><rect x="40" y="60" width="152" height="152" rx="10" fill="#0a0d1d" stroke="#171b41"/><circle cx="60" cy="82" r="11" fill="none" stroke="#666fe8" stroke-width="1.2"/><text x="60" y="86" font-size="10" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >1</text><text x="84" y="86" font-size="10.5" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8">CALIBRATE</text><text x="54" y="112" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >known bits 0,1</text><text x="54" y="130" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >alternate for 12</text><text x="54" y="148" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >rounds; threshold =</text><text x="54" y="166" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >midpoint of medians</text><path d="M193 136 L203 136" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="204" y="60" width="152" height="152" rx="10" fill="#0a0d1d" stroke="#171b41"/><circle cx="224" cy="82" r="11" fill="none" stroke="#666fe8" stroke-width="1.2"/><text x="224" y="86" font-size="10" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >2</text><text x="248" y="86" font-size="10.5" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8">ENCODE</text><text x="218" y="112" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bit 0 -&gt; 4 steps</text><text x="218" y="130" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bit 1 -&gt; 32 steps</text><text x="218" y="148" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >prompt 16 vs 1024</text><text x="218" y="166" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >tokens</text><path d="M357 136 L367 136" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="368" y="60" width="152" height="152" rx="10" fill="#0a0d1d" stroke="#171b41"/><circle cx="388" cy="82" r="11" fill="none" stroke="#666fe8" stroke-width="1.2"/><text x="388" y="86" font-size="10" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >3</text><text x="412" y="86" font-size="10.5" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8">CO-SCHEDULE</text><text x="382" y="112" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sender and receiver</text><text x="382" y="130" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >in one batch;</text><text x="382" y="148" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >background streams</text><text x="382" y="166" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >keep running</text><path d="M521 136 L531 136" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="532" y="60" width="152" height="152" rx="10" fill="#0a0d1d" stroke="#171b41"/><circle cx="552" cy="82" r="11" fill="none" stroke="#666fe8" stroke-width="1.2"/><text x="552" y="86" font-size="10" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >4</text><text x="576" y="86" font-size="10.5" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8">DECODE</text><text x="546" y="112" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >receiver's own</text><text x="546" y="130" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >mean step time</text><text x="546" y="148" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >vs threshold;</text><text x="546" y="166" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >no sender row</text><path d="M685 136 L695 136" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="696" y="60" width="152" height="152" rx="10" fill="#0a0d1d" stroke="#171b41"/><circle cx="716" cy="82" r="11" fill="none" stroke="#666fe8" stroke-width="1.2"/><text x="716" y="86" font-size="10" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >5</text><text x="740" y="86" font-size="10.5" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="0.8">BUDGET</text><text x="710" y="112" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >correct - wrong</text><text x="710" y="130" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bits / slot sec;</text><text x="710" y="148" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bootstrap ci95;</text><text x="710" y="166" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >shuffled-bit null</text><text x="40" y="248" font-size="10" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >batch lane</text><line x1="120" y1="244" x2="836" y2="244" stroke="#171b41" stroke-width="1"/><text x="40" y="278" font-size="10" font-weight="600" fill="#a46ae7" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sender</text><rect x="130" y="314" width="12" height="6" rx="2" fill="#a46ae7" opacity="0.45"/><rect x="156" y="294" width="12" height="26" rx="2" fill="#a46ae7" opacity="0.85"/><rect x="182" y="314" width="12" height="6" rx="2" fill="#a46ae7" opacity="0.45"/><rect x="208" y="294" wid