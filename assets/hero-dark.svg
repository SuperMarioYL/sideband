<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Sideband — the covert-channel meter for shared inference servers" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sideband — the covert-channel meter for shared inference servers</title><desc>Hero figure: two Agent sessions share one inference engine, cannot open a socket to each other, and Sideband measures the bit rate that crosses anyway.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="880" height="380" fill="#050712"/><defs><radialGradient id="hg" cx="76%" cy="50%" r="55%"><stop offset="0%" stop-color="#666fe8" stop-opacity="0.30"/><stop offset="100%" stop-color="#050712" stop-opacity="0"/></radialGradient><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#acccf6" stop-opacity="0"/><stop offset="50%" stop-color="#acccf6" stop-opacity="0.55"/><stop offset="100%" stop-color="#acccf6" stop-opacity="0"/></linearGradient></defs><rect width="880" height="380" fill="url(#hg)"/><line x1="0" y1="40" x2="880" y2="40" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="80" x2="880" y2="80" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="120" x2="880" y2="120" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="160" x2="880" y2="160" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="200" x2="880" y2="200" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="240" x2="880" y2="240" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="280" x2="880" y2="280" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="0" y1="320" x2="880" y2="320" stroke="#171b41" stroke-width="0.6" opacity=".55"/><line x1="440" y1="0" x2="440" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="480" y1="0" x2="480" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="520" y1="0" x2="520" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="560" y1="0" x2="560" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="600" y1="0" x2="600" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="640" y1="0" x2="640" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="680" y1="0" x2="680" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="720" y1="0" x2="720" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="760" y1="0" x2="760" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="800" y1="0" x2="800" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><line x1="840" y1="0" x2="840" y2="380" stroke="#171b41" stroke-width="0.6" opacity=".35"/><text x="56" y="70" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2.6">COVERT-CHANNEL METER</text><text x="52" y="140" font-size="62" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Sideband</text><rect x="56" y="158" width="132" height="2" fill="#666fe8"/><text x="56" y="196" font-size="15" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Measure how many bits per second cross between</text><text x="56" y="218" font-size="15" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >two sessions that share one inference engine —</text><text x="56" y="240" font-size="15" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >and never open a socket to each other.</text><text x="56" y="276" font-size="16" font-weight="650" fill="#acccf6" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Isolation becomes a number you can re-run.</text><g><rect x="56" y="300" width="118" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="115.0" y="316" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >1 bit / round</text></g><g><rect x="186" y="300" width="150" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="261.0" y="316" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >ci95 by bootstrap</text></g><g><rect x="348" y="300" width="172" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="434.0" y="316" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >replay needs no GPU</text></g><circle cx="742" cy="190" r="104" fill="none" stroke="#171b41" stroke-width="1" class="pulse"/><circle cx="742" cy="190" r="78" fill="none" stroke="#171b41" stroke-width="1" class="pulse" style="animation-delay:1.4s"/><circle cx="742" cy="190" r="54" fill="#0c101f" stroke="#666fe8" stroke-width="1.6"/><text x="742" y="184" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >your</text><text x="742" y="202" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >engine</text><circle cx="566" cy="88" r="28" fill="#0a0d1d" stroke="#a46ae7" stroke-width="1.6"/><text x="566" y="93" font-size="11" font-weight="650" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >send</text><text x="566" y="48" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >session A</text><circle cx="566" cy="300" r="28" fill="#0a0d1d" stroke="#acccf6" stroke-width="1.6"/><text x="566" y="305" font-size="11" font-weight="650" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >recv</text><text x="566" y="346" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >session B</text><path d="M590 100 Q 676 122 700 158" stroke="#666fe8" stroke-width="1.5" fill="none" class="flow"/><path d="M590 288 Q 676 266 700 230" stroke="#666fe8" stroke-width="1.5" fill="none" class="flow"/><line x1="566" y1="120" x2="566" y2="268" stroke="#959ec4" stroke-width="1.2" stroke-dasharray="4 7" opacity=".75"/><line x1="556" y1="181" x2="576" y2="199" stroke="#acccf6" stroke-width="1.8"/><line x1="576" y1="181" x2="556" y2="199" stroke="#acccf6" stroke-width="1.8"/><text x="546" y="196" font-size="11" font-weight="500" fill="#959ec4" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >no socket</text><rect x="588" y="168" width="188" height="3" rx="1.5" fill="url(#hb)" opacity=".8"/><circle cx="622" cy="120" r="2.6" fill="#acccf6" opacity=".35" class="converge" style="--dx:98px; --dy:57px; animation-delay:0.0s"/><circle cx="838" cy="104" r="2.0" fill="#acccf6" opacity=".35" class="converge" style="--dx:-79px; --dy:71px; animation-delay:0.7s"/><circle cx="610" cy="234" r="2.2" fill="#acccf6" opacity=".35" class="converge" style="--dx:108px; --dy:-36px; animation-delay:1.4s"/><circle cx="860" cy="242" r="1.8" fill="#acccf6" opacity=".35" class="converge" style="--dx:-97px; --dy:-43px; animation-delay:2.1s"/><circle cx="678" cy="74" r="1.6" fill="#acccf6" opacity=".35" class="converge" style="--dx:52px; --dy:95px; animation-delay:2.8s"/><circle cx="786" cy="296" r="2.4" fill="#acccf6" opacity=".35" class="converge" style="--dx:-36px; --dy:-87px; animation-delay:3.5s"/><circle cx="724" cy="62" r="1.6" fill="#acccf6" opacity=".35" class="converge" style="--dx:15px; --dy:105px; animation-delay:4.2s"/><circle cx="882" cy="172" r="1.8" fill="#acccf6" opacity=".35" class="converge" style="--dx:-115px; --dy:15px; animation-delay:4.9s"/><text x="56" y="356" font-size="10" font-weight="500" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >step-sizing encoder · 300 ms round · verdict open / closed / inconclusive</text></svg>