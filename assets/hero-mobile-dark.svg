<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" role="img" aria-label="Sideband — measure the channel between two sessions on one engine" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sideband — measure the channel between two sessions on one engine</title><desc>Two sessions share one inference engine and never open a socket to each other; Sideband reads bits per session per second from timing alone.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="420" height="560" fill="#050712"/><defs><radialGradient id="hg" cx="50%" cy="66%" r="60%"><stop offset="0%" stop-color="#666fe8" stop-opacity="0.26"/><stop offset="100%" stop-color="#050712" stop-opacity="0"/></radialGradient></defs><rect width="420" height="560" fill="url(#hg)"/><text x="24" y="44" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2.2">COVERT-CHANNEL METER</text><text x="22" y="92" font-size="46" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Sideband</text><rect x="24" y="108" width="96" height="2" fill="#666fe8"/><text x="24" y="140" font-size="14" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >How many bits per second cross between</text><text x="24" y="160" font-size="14" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >two sessions that share one inference</text><text x="24" y="180" font-size="14" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >engine and never open a socket?</text><text x="24" y="210" font-size="14" font-weight="600" fill="#acccf6" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Isolation becomes a number you can re-run.</text><g><rect x="24" y="230" width="116" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="82.0" y="246" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >1 bit / round</text></g><g><rect x="150" y="230" width="148" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="224.0" y="246" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >ci95 by bootstrap</text></g><g><rect x="24" y="262" width="158" height="24" rx="12" fill="none" stroke="#171b41" stroke-width="1"/><text x="103.0" y="278" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >replay needs no GPU</text></g><circle cx="210" cy="360" r="74" fill="none" stroke="#171b41" stroke-width="1" class="pulse"/><circle cx="210" cy="360" r="52" fill="#0c101f" stroke="#666fe8" stroke-width="1.5"/><text x="210" y="355" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >your</text><text x="210" y="372" font-size="13" font-weight="600" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >engine</text><circle cx="96" cy="476" r="26" fill="#0a0d1d" stroke="#a46ae7" stroke-width="1.5"/><text x="96" y="481" font-size="11" font-weight="600" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >send</text><circle cx="324" cy="476" r="26" fill="#0a0d1d" stroke="#acccf6" stroke-width="1.5"/><text x="324" y="481" font-size="11" font-weight="600" fill="#eef5fd" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >recv</text><path d="M96 450 L178 408" stroke="#666fe8" stroke-width="1.4" fill="none" class="flow" opacity=".85"/><path d="M324 450 L242 408" stroke="#666fe8" stroke-width="1.4" fill="none" class="flow" opacity=".85"/><path d="M124 476 L294 476" stroke="#959ec4" stroke-width="1.2" stroke-dasharray="4 6" fill="none" opacity=".8"/><line x1="200" y1="467" x2="220" y2="485" stroke="#acccf6" stroke-width="1.6"/><line x1="220" y1="467" x2="200" y2="485" stroke="#acccf6" stroke-width="1.6"/><text x="210" y="516" font-size="11" font-weight="500" fill="#959ec4" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >no socket between sessions</text><circle cx="127" cy="283" r="2.4" fill="#acccf6" opacity=".35" class="converge" style="--dx:47px; --dy:58px; animation-delay:0.0s"/><circle cx="303" cy="298" r="2.0" fill="#acccf6" opacity=".35" class="converge" style="--dx:-52px; --dy:47px; animation-delay:0.9s"/><circle cx="101" cy="382" r="1.8" fill="#acccf6" opacity=".35" class="converge" style="--dx:61px; --dy:-16px; animation-delay:1.8s"/><circle cx="316" cy="391" r="2.2" fill="#acccf6" opacity=".35" class="converge" style="--dx:-59px; --dy:-23px; animation-delay:2.7s"/><circle cx="226" cy="250" r="1.6" fill="#acccf6" opacity=".35" class="converge" style="--dx:-9px; --dy:83px; animation-delay:3.6s"/></svg>