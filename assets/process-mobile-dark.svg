<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-label="The step-sizing round" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The step-sizing round</title><desc>Five stages: calibrate the threshold, encode one bit as 4 or 32 decode steps, co-schedule with background traffic, decode from the receiver's own timings, and report a bootstrap interval with a verdict.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="420" height="640" fill="#050712"/><text x="24" y="38" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1.8">ONE ROUND, FIVE STAGES</text><circle cx="38" cy="72" r="13" fill="#0c101f" stroke="#666fe8" stroke-width="1.3"/><text x="38" y="77" font-size="11" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >1</text><text x="62" y="77" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Calibrate</text><text x="62" y="102" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >known bits alternate 0,1 for the first 12 rounds;</text><text x="62" y="117" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >threshold = midpoint of the two step-time medians</text><line x1="38" y1="86" x2="38" y2="162" stroke="#666fe8" stroke-width="1.2" class="flow" opacity=".7"/><circle cx="38" cy="184" r="13" fill="#0c101f" stroke="#666fe8" stroke-width="1.3"/><text x="38" y="189" font-size="11" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >2</text><text x="62" y="189" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Encode</text><text x="62" y="214" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bit -&gt; 4 or 32 decode steps, plus a 16 vs 1024 token</text><text x="62" y="229" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >prompt</text><line x1="38" y1="198" x2="38" y2="274" stroke="#666fe8" stroke-width="1.2" class="flow" opacity=".7"/><circle cx="38" cy="296" r="13" fill="#0c101f" stroke="#666fe8" stroke-width="1.3"/><text x="38" y="301" font-size="11" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >3</text><text x="62" y="301" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Co-schedule</text><text x="62" y="326" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sender and receiver land in the same continuous batch;</text><text x="62" y="341" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >background streams keep running</text><line x1="38" y1="310" x2="38" y2="386" stroke="#666fe8" stroke-width="1.2" class="flow" opacity=".7"/><circle cx="38" cy="408" r="13" fill="#0c101f" stroke="#666fe8" stroke-width="1.3"/><text x="38" y="413" font-size="11" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >4</text><text x="62" y="413" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Decode</text><text x="62" y="438" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >receiver compares its own mean inter-token latency to</text><text x="62" y="453" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the threshold; it never reads the sender's row</text><line x1="38" y1="422" x2="38" y2="498" stroke="#666fe8" stroke-width="1.2" class="flow" opacity=".7"/><circle cx="38" cy="520" r="13" fill="#0c101f" stroke="#666fe8" stroke-width="1.3"/><text x="38" y="525" font-size="11" font-weight="700" fill="#666fe8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >5</text><text x="62" y="525" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Budget</text><text x="62" y="550" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >correct minus wrong bits over the slot seconds,</text><text x="62" y="565" font-size="10.5" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >bootstrap ci95, shuffled-bit null, verdict</text><text x="24" y="620" font-size="9.5" font-weight="600" fill="#acccf6" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >background traffic is measured and never decoded</text></svg>