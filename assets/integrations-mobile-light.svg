<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="What Sideband reads and writes" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What Sideband reads and writes</title><desc>Read-back routes /version, /v1/models and /metrics; probe traffic on /v1/chat/completions; operator-declared max_num_seqs and launch command; outputs channel_budget.json, channel_budget.md and a probe trace.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="420" height="660" fill="#f9f9fe"/><text x="24" y="38" font-size="11" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1.8">READS · DECLARES · WRITES</text><circle cx="210" cy="104" r="44" fill="#f7f7fe" stroke="#5660e6" stroke-width="1.4"/><text x="210" y="100" font-size="12" font-weight="650" fill="#131730" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sideband</text><text x="210" y="116" font-size="9" font-weight="500" fill="#556088" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >0.1.0</text><rect x="24" y="176" width="372" height="94" rx="9" fill="#f3f4fd" stroke="#cbcef7"/><text x="40" y="198" font-size="10" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1">Read back</text><text x="40" y="218" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >GET /version</text><text x="40" y="238" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >GET /v1/models</text><text x="40" y="258" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >GET /metrics</text><rect x="24" y="288" width="372" height="74" rx="9" fill="#f3f4fd" stroke="#cbcef7"/><text x="40" y="310" font-size="10" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1">Probe traffic</text><text x="40" y="330" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >POST /v1/chat/completions</text><text x="40" y="350" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sender · receiver · background</text><rect x="24" y="380" width="372" height="74" rx="9" fill="#f3f4fd" stroke="#cbcef7"/><text x="40" y="402" font-size="10" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1">You declare</text><text x="40" y="422" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >--declare-max-num-seqs</text><text x="40" y="442" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >--launch-cmd</text><rect x="24" y="472" width="372" height="94" rx="9" fill="#f3f4fd" stroke="#cbcef7"/><text x="40" y="494" font-size="10" font-weight="600" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1">Written</text><text x="40" y="514" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >channel_budget.json</text><text x="40" y="534" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >channel_budget.md</text><text x="40" y="554" font-size="10.5" font-weight="500" fill="#131730" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >probe trace JSONL</text><text x="24" y="592" font-size="10" font-weight="600" fill="#607189" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Engines: vLLM · llama.cpp server · SGLang</text><text x="24" y="610" font-size="9.5" font-weight="400" fill="#556088" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >any OpenAI-compatible endpoint works</text></svg>