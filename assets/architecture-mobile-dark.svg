<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" width="420" height="650" role="img" aria-label="Sideband architecture" data-palette="5660e6-a46ae7-acccf6-87d381af0c00" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sideband architecture</title><desc>One Python process: CLI, engine adapter, canary, measurement, replay, report and models; it calls the user's engine over HTTP and writes a trace and a budget.</desc><style>
    .flow { stroke-dasharray: 5 9; animation: flow 2.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }
    .converge { animation: converge 6s linear infinite; }
    @keyframes converge {
      0% { transform: translate(0, 0); opacity: .12; }
      25% { opacity: .85; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .spin { animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { animation: glow 6s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .converge, .spin, .glow { animation: none; }
      .flow { stroke-dasharray: 5 9; }
      .converge { opacity: .45; }
    }
</style><rect width="420" height="650" fill="#050712"/><text x="24" y="38" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1.8">ONE PROCESS, ONE HTTP DEPENDENCY</text><rect x="24" y="56" width="372" height="52" rx="10" fill="#0c101f" stroke="#666fe8"/><text x="44" y="79" font-size="15" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sideband CLI</text><text x="44" y="96" font-size="11" font-weight="500" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >measure · replay · fingerprint</text><line x1="210" y1="108" x2="210" y2="130" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="24" y="130" width="372" height="222" rx="10" fill="#0a0d1d" stroke="#171b41"/><text x="40" y="152" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >sideband/ · Python package</text><text x="40" y="172" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >engine.py</text><text x="150" y="172" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >public HTTP surface + fingerprint</text><text x="40" y="201" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >canary.py</text><text x="150" y="201" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >encode / calibrate / decode</text><text x="40" y="230" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >measure.py</text><text x="150" y="230" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sweep · ratio · bootstrap · verdict</text><text x="40" y="259" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >replay.py</text><text x="150" y="259" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >a trace through the same analyse()</text><text x="40" y="288" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >report.py</text><text x="150" y="288" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >channel_budget.json + .md</text><text x="40" y="317" font-size="12" font-weight="600" fill="#666fe8" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >models.py</text><text x="150" y="317" font-size="11" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >ChannelBudget / ProbeTrace</text><line x1="210" y1="352" x2="210" y2="376" stroke="#666fe8" stroke-width="1.4" class="flow"/><text x="216" y="370" font-size="10" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >HTTP</text><rect x="24" y="376" width="372" height="92" rx="10" fill="#0c101f" stroke="#a46ae7"/><text x="40" y="400" font-size="14" font-weight="650" fill="#eef5fd" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >your inference engine</text><text x="40" y="421" font-size="11" font-weight="500" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >vLLM · llama.cpp server · SGLang</text><text x="40" y="444" font-size="11" font-weight="600" fill="#acccf6" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >never bundled, never installed</text><line x1="210" y1="468" x2="210" y2="492" stroke="#666fe8" stroke-width="1.4" class="flow"/><rect x="24" y="492" width="372" height="130" rx="10" fill="#0a0d1d" stroke="#171b41"/><text x="40" y="514" font-size="11" font-weight="600" fill="#959ec4" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >artifacts</text><text x="40" y="540" font-size="12" font-weight="600" fill="#eef5fd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >probe trace JSONL</text><text x="40" y="558" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the evidence</text><text x="40" y="588" font-size="12" font-weight="600" fill="#eef5fd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >channel_budget.json / .md</text><text x="40" y="606" font-size="10" font-weight="400" fill="#959ec4" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the claim, with provenance</text></svg>